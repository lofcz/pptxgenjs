name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump package version
        id: version
        run: |
          npm version "${{ github.event.inputs.release_type }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/const VERSION = '.*'/const VERSION = '${VERSION}'/" src/pptxgen.ts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run dist

      - name: Verify package contents
        run: |
          ls -l dist/pptxgen.bundle.js dist/pptxgen.min.js dist/pptxgen.cjs.js dist/pptxgen.es.js
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Commit release version and create tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json src/pptxgen.ts
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/pptxgen.bundle.js
            dist/pptxgen.min.js
            dist/pptxgen.cjs.js
            dist/pptxgen.es.js
