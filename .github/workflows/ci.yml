name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun ci
      - run: bun run check
      - run: bun run build

  office-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun ci
      - name: Install LibreOffice Impress
        run: sudo apt-get update && sudo apt-get install --yes libreoffice-impress
      - name: Open generated presentation in LibreOffice
        run: PPTXGENJS_OFFICE_BIN=libreoffice bun run test:office
